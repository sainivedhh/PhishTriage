[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phishtriage"
version = "0.1.0"
description = "Automated Phishing & BEC Detection and Triage Pipeline"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Security Engineering Team" }]
dependencies = [
    "pydantic==2.11.7",
    "typer==0.16.0",
    "rich==14.1.0",
    "pyyaml==6.0.2",
    "beautifulsoup4==4.13.4",
    "tldextract==5.3.0",
    "rapidfuzz==3.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "pytest-cov==6.2.1",
    "ruff==0.12.8",
    "mypy==1.17.1",
]

[project.scripts]
phishtriage = "phishtriage.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
