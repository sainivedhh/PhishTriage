name: PhishTriage CI & Evaluation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Format and autofix lint issues
        run: |
          ruff check --fix src tests
          ruff format src tests

      - name: Verify lint
        run: |
          ruff check src tests

      - name: Run Pytest Suite
        run: |
          pytest --cov=src/phishtriage tests/

      - name: Generate Synthetic Evaluation Dataset
        run: |
          python src/phishtriage/dataset_generator.py

      - name: Run Pipeline Evaluation (Fail CI if F1 < 0.95)
        run: |
          python -c "
          from phishtriage.eval import DatasetEvaluator
          import sys
          evaluator = DatasetEvaluator()
          results = evaluator.run_and_print()
          f1 = results['f1']
          print(f'CI Evaluation F1 Score: {f1}')
          if f1 < 0.95:
              print(f'CRITICAL: F1 Score {f1} is below quality threshold 0.95')
              sys.exit(1)
          "


      - name: Build Python Distribution
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Upload Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phishtriage-dist
          path: dist/
          if-no-files-found: error
