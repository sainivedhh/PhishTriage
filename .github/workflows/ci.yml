name: PhishTriage CI & Evaluation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --only-binary=:all: "pip==25.2"
          python -m pip install --only-binary=:all: -e ".[dev]"

      - name: Format and autofix lint issues
        run: |
          ruff check --fix --ignore BLE001,S110 src tests
          ruff format src tests

      - name: Verify lint
        run: |
          ruff check --ignore BLE001,S110 src tests

      - name: Generate Synthetic Evaluation Dataset
        run: |
          python src/phishtriage/dataset_generator.py

      - name: Run Pytest Suite
        run: |
          pytest --cov=src/phishtriage tests/

      - name: Run Pipeline Evaluation (Fail CI if F1 < 0.95)
        run: |
          python -c "
          from phishtriage.eval import DatasetEvaluator
          import sys
          evaluator = DatasetEvaluator()
          results = evaluator.run_and_print()
          f1 = results['f1']
          print(f'CI Evaluation F1 Score: {f1}')
          if f1 < 0.95:
              print(f'CRITICAL: F1 Score {f1} is below quality threshold 0.95')
              sys.exit(1)
          "

      - name: Build Python Distribution
        run: |
          python -m pip install --only-binary=:all: "build==1.3.0"
          python -m build

      - name: Upload Distribution Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phishtriage-dist
          path: dist/
          if-no-files-found: error
